# 1. Upstream Backend Pool
upstream express-booking-api {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # 2. Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/json
        text/plain
        application/javascript
        text/css
        application/xml;

    # 3. OWASP Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 4. Request Body Limit (Anti Buffer Overflow)
    client_max_body_size 10M;

    # 5. Reverse Proxy Rules
    location / {
        proxy_pass http://express-booking-api;
        proxy_http_version 1.1;

        # Meneruskan Identitas Asli Klien (Krusial untuk Rate Limiter!)
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout Proteksi Server
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
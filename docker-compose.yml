services:
  # =================================================================
  # 1. DATABASE RELASIONAL POSTGRESQL (PILIHAN A: CONTAINER DOCKER)
  # =================================================================
  # NOTE:
  # - Aktifkan blok service ini jika ingin database berjalan di dalam Docker.
  # - Komentari (#) seluruh blok postgres ini jika ingin menggunakan PostgreSQL lokal (Windows/WSL).
  postgres:
    image: postgres:16-alpine
    container_name: express_booking_engine_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-booking_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - express_booking_net

  # =================================================================
  # 2. REDIS IN-MEMORY CACHE & RATE LIMITER (CONTAINER DOCKER)
  # =================================================================
  redis:
    image: redis:7-alpine
    container_name: express_booking_engine_redis
    restart: unless-stopped
    # Port host dimatikan agar tidak bentrok dengan redis-server lokal di host WSL
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - express_booking_net

  # =================================================================
  # 3. APLIKASI BACKEND EXPRESS API
  # =================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: express-booking:0.1-api
    container_name: express_booking_engine_api
    restart: unless-stopped
    # ports:
    #   - "3000:3000"
    
    # Ganti jadi expose (hanya bisa diakses internal oleh Nginx)
    expose:
      - "3000" 

    # ----------------------------------------------------------------------
    # PINTU KELUAR KE HOST (Gunakan ini jika ingin menembak DB lokal komputer)
    # ----------------------------------------------------------------------
    # extra_hosts:
    #   - "host.docker.internal:host-gateway" # Aktifkan baris ini jika DB_HOST=host.docker.internal

    environment:
      NODE_ENV: production
      PORT: 3000

      # === PENGATURAN HOST DATABASE ===
      # Opsi 1 (Default): Konek ke PostgreSQL Container Docker
      DB_HOST: postgres

      # Opsi 2 (Lokal Host): Konek ke PostgreSQL yang terinstall di Windows/WSL
      # DB_HOST: host.docker.internal
      # DB_HOST: ${DB_HOST:-postgres}

      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-booking_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-secret_jwt_key_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-secret_jwt_refresh_key_production}
      EXPIRED_ACCESS_TOKEN: ${EXPIRED_ACCESS_TOKEN:-30m}
      EXPIRED_REFRESH_TOKEN: ${EXPIRED_REFRESH_TOKEN:-3d}
    depends_on:
      # NOTE: Jika service postgres di atas di-komentari (#), komentari juga 2 baris postgres di bawah ini!
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - express_booking_net

  # 4. Nginx Reverse Proxy Gateway
  nginx:
    image: nginx:alpine
    container_name: express_booking_engine_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - express_booking_net

# Volume Persisten (Data tidak hilang saat container dimatikan)
volumes:
  postgres_data:
  redis_data:

# Jaringan Privat Terisolasi
networks:
  express_booking_net:
    driver: bridge
